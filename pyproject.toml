[project]
name = "crontainer"
version = "0.1.0"
description = "Schedule and manage Docker containers with cron."
requires-python = ">=3.12"
dependencies = [
    "Django==5.2.1",
    "cron-descriptor==1.4.3",
    "django-environ==0.11.2",
    "djangorestframework==3.15.2",
    "docker==7.1.0",
    "gunicorn==23.0.0",
    "PyYAML==6.0.2",
    "python-dateutil==2.9.0.post0",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.4",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "DJ", "PL", "UP"]
ignore = ["DJ008", "DJ012", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"manage.py" = ["PLC0415"]
