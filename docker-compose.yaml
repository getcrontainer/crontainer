services:
  crontainer:
    container_name: crontainer
    build: .
    ports:
      - "9090:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - crontainer-data:/app/data
    environment:
      DEBUG: False
      CRONTAB_PATH: "/etc/cron.d"
      ADMIN_USERNAME: "admin"
      ADMIN_PASSWORD: "admin"

volumes:
  crontainer-data:
